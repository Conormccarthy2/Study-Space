<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | StudySpace</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body class="home">
    <a href="#main">Skip to content</a>
    <!-- Navigation "Flower" Button-->

    <nav class="menu" aria-label="Site navigation">
      <button
        id="toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="links"
      >
        +
      </button>

      <div id="links" inert>
        <a href="index.html" aria-current="page">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="timer.html">Focus timer</a>
        <a href="todo.html">To-do list</a>
        <a href="reminders.html">Reminders</a>
        <a href="session-history.html">Session history</a>
        <a href="team.html">Our team</a>
        <a href="study-tips.html">Study tips</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact us</a>
      </div>
    </nav>

    <main id="main" class="home-layout" tabindex="-1">
      <header class="home-welcome">
        <!-- Home clock -->
        <div class="home-clock" id="home-clock" hidden>
          <time id="home-date"></time>
          <time id="home-time"></time>
        </div>

        <h1>Hello, <span id="display-name">there</span>!</h1>
        <p>Welcome to StudySpace.</p>

        <a class="home-focus-button" href="timer.html">
          <span class="home-play" aria-hidden="true"></span>
          Start a focus session
        </a>
      </header>

      <!-- Quick links -->
      <section
        class="session-card home-shortcuts"
        aria-labelledby="quick-links-heading"
      >
        <h2 id="quick-links-heading">What would you like to do?</h2>
        <ul>
          <li><a href="dashboard.html">Go to dashboard</a></li>
          <li><a href="todo.html">Go to to-do list</a></li>
          <li><a href="reminders.html">View reminders</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
