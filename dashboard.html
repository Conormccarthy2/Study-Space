<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | StudySpace</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>

  <body class="dashboard">
    <a href="#main">Skip to content</a>

    <nav class="menu" aria-label="Site navigation">
      <button
        id="toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="links"
      >
        +
      </button>

      <div id="links" inert>
        <a href="home.html">Home</a>
        <a href="dashboard.html" aria-current="page">Dashboard</a>
        <a href="index.html">Focus timer</a>
        <a href="todo.html">To-do list</a>
        <a href="reminders.html">Reminders</a>
        <a href="session-history.html">Session history</a>
        <a href="team.html">Our team</a>
        <a href="study-tips.html">Study tips</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact us</a>
      </div>
    </nav>

    <main id="main">
      <h1>Dashboard</h1>

      <section class="session-card" aria-labelledby="week-heading">
        <h2 id="week-heading">This week</h2>

        <div class="stats">
          <p><strong id="stat-work-sessions">0</strong> sessions</p>
          <p><strong id="stat-focus-minutes">0</strong> min</p>
          <p><strong id="stat-weekly-tasks">0</strong> tasks</p>
        </div>

        <a class="reminder-link" href="reminders.html">
          <span
            >Reminders due in 7 days:
            <b id="stat-upcoming-reminders">0</b></span
          >
          <span aria-hidden="true">›</span>
        </a>
      </section>
    </main>
  </body>
</html>
