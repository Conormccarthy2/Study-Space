<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | StudySpace</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to content</a
    >
    <div class="site-layout">
      <aside class="sidebar">
        <a class="site-brand" href="home.html">
          <img src="images/logo.png" width="54" height="54" alt="" />
          <span>StudySpace</span>
        </a>
        <nav class="nav flex-column" aria-label="Main navigation">
          <a class="nav-link" href="home.html">Home</a>
          <a class="nav-link" href="index.html">Focus timer</a>
          <a class="nav-link active" aria-current="page" href="dashboard.html"
            >Dashboard</a
          >
          <a class="nav-link" href="todo.html">To-do list</a>
          <a class="nav-link" href="reminders.html">Reminders</a>
          <a class="nav-link" href="session-history.html">Session history</a>
          <a class="nav-link" href="team.html">Our team</a>
          <a class="nav-link" href="study-tips.html">Study tips</a>
          <a class="nav-link" href="reviews.html">Reviews</a>
          <a class="nav-link" href="contact.html">Contact us</a>
        </nav>
      </aside>
      <main id="main" class="container-fluid workspace">
        <header class="page-heading">
          <h1>Dashboard</h1>
        </header>
        <section aria-labelledby="week-heading">
          <h2 id="week-heading" class="section-heading">This week</h2>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <section class="panel stat-card h-100">
                <h3>Completed work sessions</h3>
                <p class="stat-number mb-0" id="stat-work-sessions">0</p>
              </section>
            </div>
            <div class="col-12 col-md-4">
              <section class="panel stat-card h-100">
                <h3>Total focus time</h3>
                <p class="stat-number mb-0">
                  <span id="stat-focus-minutes">0</span>
                  <span class="stat-unit">min</span>
                </p>
              </section>
            </div>
            <div class="col-12 col-md-4">
              <section class="panel stat-card h-100">
                <h3>Tasks ticked off</h3>
                <p class="stat-number mb-0" id="stat-weekly-tasks">0</p>
              </section>
            </div>
          </div>
        </section>
        <section
          class="panel reminder-summary mt-4 d-flex flex-wrap justify-content-between align-items-center gap-3"
        >
          <div>
            <h2>Reminders due in the next 7 days</h2>
            <a href="reminders.html">View reminders</a>
          </div>
          <p class="stat-number mb-0" id="stat-upcoming-reminders">0</p>
        </section>
      </main>
    </div>
  </body>
</html>
