<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reminders | StudySpace</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="reminders">
    <a href="#main">Skip to content</a>
    <nav class="menu" aria-label="Site navigation">
      <button
        id="toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="links"
      >
        +
      </button>
      <div id="links" inert>
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Focus timer</a>
        <a href="todo.html">To-do list</a>
        <a aria-current="page" href="reminders.html">Reminders</a>
        <a href="session-history.html">Session history</a>
        <a href="team.html">Our team</a>
        <a href="study-tips.html">Study tips</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact us</a>
      </div>
    </nav>
    <main id="main">
      <h1>Reminders</h1>
      <p>Keep upcoming dates and deadlines in one place.</p>
      <p id="today"></p>
      <section class="session-card task-card" aria-labelledby="reminders-heading">
        <form id="reminder-form">
          <label for="reminder-name">
            Reminder
            <input id="reminder-name" type="text" placeholder="e.g. Submit project" required>
          </label>
          <label for="reminder-date">
            Due date
            <input id="reminder-date" type="date" required>
          </label>
          <button type="submit">Add reminder</button>
        </form>
        <header>
          <h2 id="reminders-heading">Your reminders</h2>
          <p id="reminder-count" aria-live="polite">0 reminders</p>
        </header>
        <ul id="reminder-list"></ul>
        <p id="reminder-empty">
          No reminders yet. Add a reminder and its due date above.
        </p>
      </section>
    </main>
  </body>
</html>
