<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reminders | StudySpace</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="reminders">
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to content</a
    >
    <div class="site-layout">
      <aside class="sidebar">
        <a class="site-brand" href="home.html">
          <img src="images/logo.png" width="54" height="54" alt="" />
          <span>StudySpace</span>
        </a>
        <nav class="nav flex-column" aria-label="Main navigation">
          <a class="nav-link" href="home.html">Home</a>
          <a class="nav-link" href="index.html">Focus timer</a>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="todo.html">To-do list</a>
          <a class="nav-link active" aria-current="page" href="reminders.html"
            >Reminders</a
          >
          <a class="nav-link" href="session-history.html">Session history</a>
          <a class="nav-link" href="team.html">Our team</a>
          <a class="nav-link" href="study-tips.html">Study tips</a>
          <a class="nav-link" href="reviews.html">Reviews</a>
          <a class="nav-link" href="contact.html">Contact us</a>
        </nav>
      </aside>
      <main id="main" class="container-fluid workspace">
        <header class="page-heading">
          <h1>Reminders</h1>
          <p>Keep upcoming dates and deadlines in one place.</p>
          <p id="today" class="small mt-2"></p>
        </header>
        <section class="panel">
          <form id="reminder-form" class="row g-2 align-items-end mb-4">
            <div class="col-12 col-lg">
              <label class="form-label" for="reminder-name">Reminder</label>
              <input
                class="form-control"
                id="reminder-name"
                type="text"
                placeholder="e.g. Submit project"
                required
              />
            </div>
            <div class="col-12 col-md col-lg-auto">
              <label class="form-label" for="reminder-date">Due date</label>
              <input
                class="form-control"
                id="reminder-date"
                type="date"
                required
              />
            </div>
            <div class="col-12 col-md-auto">
              <button class="btn btn-primary" type="submit">
                Add reminder
              </button>
            </div>
          </form>
          <div
            class="list-heading d-flex justify-content-between align-items-baseline flex-wrap gap-2"
          >
            <h2>Your reminders</h2>
            <p
              id="reminder-count"
              class="small text-body-secondary mb-0"
              aria-live="polite"
            >
              0 reminders
            </p>
          </div>
          <ul id="reminder-list" class="item-list list-unstyled mb-0"></ul>
          <p id="reminder-empty" class="empty-state mb-0">
            No reminders yet. Add a reminder and its due date above.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
