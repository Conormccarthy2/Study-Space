<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="help.js" defer></script>
  </head>
  <body class="content-page">
    <a href="#main">Skip to content</a>
    <nav class="menu" aria-label="Site navigation">
      <button id="toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="links">+</button>
      <div id="links" inert>
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Focus timer</a>
        <a href="todo.html">To-do list</a>

      </div>
    </nav>
    <main id="main">
      <h1>Contact Us</h1>
      <section class="session-card task-card">
        <h2>Contact Our Team Below</h2>
        <p>Have a question? Fill in the form below to contact us.</p>
        <form id="contact-form">
          <p><label for="contact-name">Name</label> <input id="contact-name" name="name" autocomplete="name" maxlength="60" required></p>
          <p><label for="contact-email">Email</label> <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></p>
          <p><label for="contact-message">Message</label> <textarea id="contact-message" name="message" rows="5" maxlength="500" required></textarea></p>
          <button type="submit">Send message</button>
        </form>
        <p id="contact-status" role="status"></p>
      </section>
    </main>
  </body>
</html>
