<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us - StudySpace</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="help.js" defer></script>
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to content</a
    >
    <div class="site-layout">
      <aside class="sidebar">
        <a class="site-brand" href="home.html">
          <span class="brand-mark"><img src="images/logo.png" width="54" height="54" alt="" /></span>
          <span>StudySpace</span>
        </a>
        <nav class="nav flex-column" aria-label="Main navigation">
          <a class="nav-link" href="home.html">
            <i class="bi bi-house-door" aria-hidden="true"></i>Home
          </a>
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-grid" aria-hidden="true"></i>Dashboard
          </a>
          <a class="nav-link" href="index.html">
            <i class="bi bi-stopwatch" aria-hidden="true"></i>Focus timer
          </a>
          <a class="nav-link" href="todo.html">
            <i class="bi bi-check-square" aria-hidden="true"></i>To-do list
          </a>
          <a class="nav-link" href="reminders.html">
            <i class="bi bi-bell" aria-hidden="true"></i>Reminders
          </a>
          <a class="nav-link" href="session-history.html">
            <i class="bi bi-bar-chart" aria-hidden="true"></i>Session history
          </a>
          <a class="nav-link" href="team.html">
            <i class="bi bi-people" aria-hidden="true"></i>Our team
          </a>
          <a class="nav-link" href="study-tips.html">
            <i class="bi bi-lightbulb" aria-hidden="true"></i>Study tips
          </a>
          <a class="nav-link" href="reviews.html">
            <i class="bi bi-star" aria-hidden="true"></i>Reviews
          </a>
          <a class="nav-link active" aria-current="page" href="contact.html">
            <i class="bi bi-envelope" aria-hidden="true"></i>Contact us
          </a>
        </nav>
      </aside>
      <main id="main" class="container-fluid workspace">
        <header class="page-heading">
          <h1>Contact Us</h1>
        </header>

        <section class="panel">
          <h2>Contact Our Team Below</h2>
          <p>Have a question? Fill in the form below to contact us.</p>

          <form id="contact-form">
            <p>
              <label class="form-label" for="contact-name">Name</label>
              <input
                class="form-control"
                id="contact-name"
                name="name"
                autocomplete="name"
                maxlength="60"
                required
              />
            </p>

            <p>
              <label class="form-label" for="contact-email">Email</label>
              <input
                class="form-control"
                id="contact-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </p>

            <p>
              <label class="form-label" for="contact-message">Message</label>
              <textarea
                class="form-control"
                id="contact-message"
                name="message"
                rows="5"
                maxlength="500"
                required
              ></textarea>
            </p>

            <button class="btn btn-primary" type="submit">Send message</button>
          </form>

          <p class="mt-3 mb-0" id="contact-status" role="status"></p>
        </section>
      </main>
    </div>
  </body>
</html>
