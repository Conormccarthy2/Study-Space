<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-do list | StudySpace</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="todo">
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to content</a
    >
    <div class="site-layout">
      <aside class="sidebar">
        <a class="site-brand" href="home.html">
          <img src="images/logo.png" width="54" height="54" alt="" />
          <span>StudySpace</span>
        </a>
        <nav class="nav flex-column" aria-label="Main navigation">
          <a class="nav-link" href="home.html">Home</a>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="index.html">Focus timer</a>
          <a class="nav-link active" aria-current="page" href="todo.html"
            >To-do list</a
          >
          <a class="nav-link" href="reminders.html">Reminders</a>
          <a class="nav-link" href="session-history.html">Session history</a>
          <a class="nav-link" href="team.html">Our team</a>
          <a class="nav-link" href="study-tips.html">Study tips</a>
          <a class="nav-link" href="reviews.html">Reviews</a>
          <a class="nav-link" href="contact.html">Contact us</a>
        </nav>
      </aside>
      <main id="main" class="container-fluid workspace">
        <header class="page-heading">
          <h1>To-do list</h1>
          <p>Capture what you need to do and check off tasks as you finish.</p>
        </header>
        <section class="panel">
          <form id="task-form" class="row g-2 align-items-end mb-4">
            <div class="col-12 col-md">
              <label class="form-label" for="task-input">New task</label>
              <input
                class="form-control"
                id="task-input"
                type="text"
                placeholder="e.g. Review lecture notes"
                required
              />
            </div>
            <div class="col-12 col-md-auto">
              <button class="btn btn-primary" type="submit">Add task</button>
            </div>
          </form>
          <div
            class="list-heading d-flex justify-content-between align-items-baseline flex-wrap gap-2"
          >
            <h2>Your tasks</h2>
            <p
              id="task-count"
              class="small text-body-secondary mb-0"
              aria-live="polite"
            >
              0 of 0 done
            </p>
          </div>
          <ul id="task-list" class="item-list list-unstyled mb-0"></ul>
          <p id="task-empty" class="empty-state mb-0">
            No tasks yet. Add your first task above.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
